<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Players | Showdown Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="page-header">
    <h1>Showdown <span>Tracker</span></h1>
  </header>

  <!-- The menu. class="active" highlights the page you're on. -->
  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="match-history.html">Match History</a>
    <a href="players.html" class="active">Players</a>
    <a href="tools.html">Tools</a>
    <!-- Sign in / sign out. Filled in by firebase.js -->
    <div class="auth-area" id="auth-area"></div>
  </nav>

  <main>
    <p class="page-status" id="page-status"></p>

    <div class="history-filters">
      <input type="search" id="player-search" class="text-input" placeholder="Search a player..." autocomplete="off">
    </div>

    <p class="dim small">Everyone you've played against or watched, plus the players other people's trackers
      shared. Click a player to see the cards they usually play with each pair of classes.</p>

    <!-- The list (filled by players.js) -->
    <div id="player-list"></div>
  </main>

  <script src="cards.js"></script>
  <script src="common.js"></script>
  <script type="module" src="firebase.js"></script>
  <script type="module" src="players.js"></script>
</body>

</html>
